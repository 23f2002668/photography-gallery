<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinions | Shahzada Moon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0b0c10; color: #ecf0f1; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 bg-[#0b0c10]/95 backdrop-blur-md border-b border-white/5 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="font-['Cinzel'] text-xl tracking-widest text-[#dfb76c] font-bold">SHAHZADA MOON</a>
        <div class="hidden md:flex space-x-6 tracking-widest text-xs uppercase items-center">
            <a href="index.html" class="text-white/60 hover:text-[#dfb76c] transition">Home</a>
            <a href="gallery.html" class="text-white/60 hover:text-[#dfb76c] transition">Exhibitions</a>
            <a href="shop.html" class="text-white/60 hover:text-[#dfb76c] transition">Prints</a>
            <a href="admin.html" class="text-white/60 hover:text-[#dfb76c] transition">Admin</a>
        </div>
    </nav>

    <section class="container mx-auto px-6 py-16">
        <header class="text-center mb-16">
            <span class="text-xs uppercase tracking-[0.4em] text-[#dfb76c]">Collector Reviews</span>
            <h2 class="font-['Cinzel'] text-3xl md:text-5xl mt-2 tracking-wide">Patron Opinions</h2>
        </header>

        <div class="max-w-xl mx-auto space-y-6 mb-12" id="opinionsContainer">
            <div class="bg-[#12131a] border border-white/5 p-6 rounded-xs"><div class="flex justify-between items-center mb-3"><h4 class="text-white font-medium text-xs tracking-wider">Arthur Pendelton</h4><span class="text-[#dfb76c] text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span></div><p class="text-white/60 text-xs italic">"The structural depth inside the framing prevents distortion, isolating high-fidelity visual assets perfectly."</p></div>
        </div>

        <div class="max-w-xl mx-auto bg-[#12131a] border border-white/5 p-8 rounded-xs">
            <form id="opinionForm" class="space-y-4 text-xs">
                <div><label class="block text-white/50 mb-2 uppercase tracking-widest">Your Name</label><input type="text" id="opinionName" required class="w-full bg-black/40 border border-white/10 text-white px-4 py-3 outline-none focus:border-[#dfb76c]"></div>
                <div><label class="block text-white/50 mb-2 uppercase tracking-widest">Your Review</label><textarea id="opinionText" required rows="4" class="w-full bg-black/40 border border-white/10 text-white px-4 py-3 outline-none focus:border-[#dfb76c] resize-none"></textarea></div>
                <button type="submit" class="w-full bg-[#dfb76c] text-black font-semibold uppercase tracking-widest py-3.5 hover:bg-white transition">Submit Review</button>
            </form>
        </div>
    </section>

    <footer class="border-t border-white/5 bg-[#07080b] py-8 text-center text-xs text-white/30 tracking-widest uppercase">&copy; 2026 Shahzada Moon Photography. All Rights Reserved.</footer>

    <script>
        document.getElementById('opinionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('opinionName').value;
            const text = document.getElementById('opinionText').value;
            const container = document.getElementById('opinionsContainer');
            const newOpinion = document.createElement('div');
            newOpinion.className = 'bg-[#12131a] border border-white/5 p-6 rounded-xs animate-fade-in';
            newOpinion.innerHTML = `<div class="flex justify-between items-center mb-3"><h4 class="text-white font-medium text-xs tracking-wider">${escapeHtml(name)}</h4><span class="text-[#dfb76c] text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></span></div><p class="text-white/60 text-xs italic">"${escapeHtml(text)}"</p>`;
            container.insertBefore(newOpinion, container.firstChild);
            this.reset();
            alert('Thank you for your review!');
        });
        function escapeHtml(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    </script>
</body>
</html>
